name: Deploy

on:
  # Production deploys on EVERY push, on any branch (main/dev are protected, so a
  # push there never comes from us — the latest push is what "prod" serves).
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint backend
        run: pnpm lint
        working-directory: backend

      - name: Test backend
        run: pnpm test:run
        working-directory: backend

      - name: Build frontend
        run: pnpm --filter frontend build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare (production)
    needs: build
    # Copies made by the Deploy to Cloudflare button deploy through Workers Builds instead.
    if: >-
      github.repository == 'lixalistudio-oss/makisend' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Any branch can push at the same time: serialize production deploys so two
    # runs never upload the Worker/Pages at once. Never cancel a deploy mid-flight.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://makisend-poc.mute-hat-0e69.workers.dev
    # Job-level permissions replace the workflow-level ones, so re-declare read
    # and add PR write for the production-URL comment below.
    permissions:
      contents: read
      deployments: write
      pull-requests: write
      # PR conversation comments are issue comments: without this the bot's
      # comment call can 403 and the deploy link never shows up.
      issues: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Worker serves the frontend itself (Static Assets) — one deployment,
      # one URL. The build job already produced the frontend once; no
      # PUBLIC_API_URL is needed anymore because UI and API share an origin.
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      # --- Backend (Workers) ---

      - name: Guard production database
        run: |
          set -eo pipefail
          # Only inspect the production job: the preview job intentionally
          # recreates its disposable database.
          if awk '/^  deploy-preview:/ { exit } { print }' .github/workflows/deploy.yml \
            | grep -nE 'd1[[:space:]]+(delete|create)'; then
            echo "::error::Destructive D1 operation found in the production deploy job"
            exit 1
          fi
          if ! grep -q '"database_name": "makisend-db"' backend/wrangler.jsonc; then
            echo "::error::Production D1 binding (makisend-db) not found in wrangler.jsonc — aborting"
            exit 1
          fi
          echo "OK: production D1 is persistent."

      - name: Configure production database ID
        id: prod-db
        run: |
          set -eo pipefail
          DB_ID=$(npx wrangler@4.131.1 d1 list --json 2>/dev/null \
            | jq -r '[.[] | select(.name == "makisend-db") | .uuid][0] // empty')
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "::error::Production D1 makisend-db not found — refusing to create or recreate it"
            exit 1
          fi
          sed -i "0,/\"database_id\":/s|\"database_id\": \"[^\"]*\"|\"database_id\": \"$DB_ID\"|" wrangler.jsonc
          if ! grep -q "\"database_id\": \"$DB_ID\"" wrangler.jsonc; then
            echo "::error::Failed to write production database_id into wrangler.jsonc"
            exit 1
          fi
          echo "db_id=$DB_ID" >> "$GITHUB_OUTPUT"
          echo "Production D1: $DB_ID (existing, untouched)"
        working-directory: backend

      - name: Apply D1 migrations (production)
        run: npx wrangler@4.131.1 d1 migrations apply makisend_db --remote
        working-directory: backend

      # The producer binding must point at an existing queue. `queues create`
      # fails when the queue already exists, hence `|| true`. The DLQ is
      # auto-created by Cloudflare when the consumer references it.
      - name: Ensure send-email queue exists (production)
        run: npx wrangler@4.131.1 queues create makisend-send-email || true
        working-directory: backend

      - name: Deploy Worker (production)
        id: deploy-worker
        run: |
          OUTPUT=$(npx wrangler@4.131.1 deploy --minify 2>&1)
          echo "$OUTPUT"
          WORKER_URL=$(echo "$OUTPUT" | grep -oP 'https://\S+\.workers\.dev' | head -1)
          echo "url=$WORKER_URL" >> "$GITHUB_OUTPUT"
        working-directory: backend

      # Secrets are provisioned once by hand and survive every deploy. This only
      # reports which ones are still missing so the app doesn't fail silently.
      # FRONTEND_URL and BETTER_AUTH_URL must equal the production Worker URL —
      # the Worker serves both the UI and the API on the same origin.
      - name: Check production secrets
        run: |
          set -eo pipefail
          REQUIRED="BETTER_AUTH_SECRET BETTER_AUTH_URL FRONTEND_URL"
          SECRETS=$(npx wrangler@4.131.1 secret list 2>/dev/null | jq -r '.[].name' || true)
          MISSING=""
          # The encryption key: ENCRYPTION_KEY, or its legacy name AES_256_KEY (still read).
          if ! echo "$SECRETS" | grep -qx "ENCRYPTION_KEY" && ! echo "$SECRETS" | grep -qx "AES_256_KEY"; then
            MISSING="$MISSING ENCRYPTION_KEY"
          fi
          for name in $REQUIRED; do
            if ! echo "$SECRETS" | grep -qx "$name"; then
              MISSING="$MISSING $name"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::warning::Missing on production Worker:$MISSING"
            echo "Set them once with: cd backend && echo \"<value>\" | npx wrangler@4.131.1 secret put <NAME>"
          else
            echo "All required production secrets are present."
          fi
        working-directory: backend

      - name: Summary
        run: |
          echo "### Production Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- App (UI + API): ${{ steps.deploy-worker.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

      # Prod deploys on every push (any branch). If that branch has an open PR,
      # tell the reviewer where the production build is live.
      # Runs even when an earlier step failed so the PR always gets the link.
      - name: Comment production URL on PR
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          WORKER_URL: ${{ steps.deploy-worker.outputs.url }}
        with:
          script: |
            const marker = '<!-- cf-prod -->';
            const branch = context.ref.replace(/^refs\/heads\//, '');
            const appUrl = process.env.WORKER_URL;

            const { data: pulls } = await github.rest.pulls.list({
              ...context.repo,
              state: 'open',
              head: `${context.repo.owner}:${branch}`,
            });
            if (!pulls.length) {
              core.info(`No open PR for branch "${branch}" — skipping comment.`);
              return;
            }

            const body = [
              marker,
              '### 🚀 Production Deploy',
              '',
              `**App (UI + API):** ${appUrl}`,
              '',
              `Deployed from branch \`${branch}\` — production updates on every push.`,
            ].join('\n');

            for (const pr of pulls) {
              const { data: comments } = await github.rest.issues.listComments({
                ...context.repo,
                issue_number: pr.number,
              });
              const existing = comments.find(
                (c) => c.user?.type === 'Bot' && c.body?.includes(marker),
              );
              if (existing) {
                await github.rest.issues.updateComment({
                  ...context.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: pr.number,
                  body,
                });
              }
            }

  deploy-preview:
    name: Deploy preview to Cloudflare
    needs: build
    if: >-
      github.repository == 'lixalistudio-oss/makisend' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # All PRs share one preview Worker and one preview D1: serialize these jobs so
    # two deploys never delete/recreate the database at the same time.
    concurrency:
      group: deploy-preview
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      # PR conversation comments are issue comments: without this the bot's
      # comment call can 403 and the deploy link never shows up.
      issues: write
    environment:
      name: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # One Worker serves the preview UI + API (Static Assets), so the preview
      # URL in the PR comment is both the site and the backend.
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      # --- Backend preview (Workers) ---

      # Preview is disposable: drop and recreate the D1 on every deploy so the schema
      # always matches the committed migrations. Editing an already-applied migration
      # file is never re-run by `d1 migrations apply`, which left this DB stale and
      # broke sign-up (422 FAILED_TO_CREATE_USER).
      #
      # Deletion is eventually consistent: a delete that answers 7404 ("could not be
      # found") means an earlier wipe already removed it — that is NOT a failure.
      # This step must never be the reason the job dies, because the PR comment
      # step runs last and would never post the preview link.
      - name: Recreate preview D1 (fresh database on every deploy)
        id: create-db
        run: |
          set -eo pipefail

          list_id() {
            npx wrangler@4.131.1 d1 list --json 2>/dev/null \
              | jq -r '.[] | select(.name == "makisend-db-preview") | .uuid' \
              | head -n1 || true
          }
          id_exists() {
            npx wrangler@4.131.1 d1 info "$1" --json >/dev/null 2>&1
          }

          # --- 1. Make sure the name "makisend-db-preview" is free ------------
          for i in $(seq 1 6); do
            ID=$(list_id)
            if [ -z "$ID" ] || [ "$ID" = "null" ]; then
              echo "makisend-db-preview name is free."
              break
            fi
            if id_exists "$ID"; then
              echo "Deleting makisend-db-preview ($ID)... attempt $i"
              npx wrangler@4.131.1 d1 delete "$ID" -y || true
            else
              echo "Listed id $ID is already gone (stale list, 7404) — waiting for it to disappear... ($i)"
            fi
            sleep 5
          done

          # --- 2. Create a brand new preview database -------------------------
          DB_ID=$(list_id)
          if [ -n "$DB_ID" ] && [ "$DB_ID" != "null" ]; then
            echo "::error::makisend-db-preview ($DB_ID) still exists after purge — cannot create a fresh database"
            exit 1
          fi

          echo "Creating makisend-db-preview..."
          npx wrangler@4.131.1 d1 create makisend-db-preview

          DB_ID=""
          for i in $(seq 1 12); do
            CAND=$(list_id)
            if [ -n "$CAND" ] && [ "$CAND" != "null" ] && id_exists "$CAND"; then
              DB_ID="$CAND"
              break
            fi
            echo "waiting for the new database to be reachable... ($i)"
            sleep 5
          done
          if [ -z "$DB_ID" ]; then
            echo "::error::Could not resolve the freshly created makisend-db-preview uuid"
            exit 1
          fi

          echo "db_id=$DB_ID" >> "$GITHUB_OUTPUT"
          echo "Created preview D1: $DB_ID"
        working-directory: backend

      - name: Configure preview database ID
        run: |
          sed -i "s/PREVIEW_DB_ID_PLACEHOLDER/${{ steps.create-db.outputs.db_id }}/" wrangler.jsonc
        working-directory: backend

      - name: Apply D1 migrations (preview)
        run: npx wrangler@4.131.1 d1 migrations apply makisend_db --remote --env preview
        working-directory: backend

      - name: Set preview Worker secrets
        run: |
          echo "${{ secrets.AES_256_KEY }}" | npx wrangler@4.131.1 secret put AES_256_KEY --env preview
          echo "${{ secrets.BETTER_AUTH_SECRET }}" | npx wrangler@4.131.1 secret put BETTER_AUTH_SECRET --env preview
        working-directory: backend

      # Preview uses its own queue so preview traffic can never be consumed by
      # the production worker (which would deliver real emails).
      - name: Ensure send-email queue exists (preview)
        run: npx wrangler@4.131.1 queues create makisend-send-email-preview || true
        working-directory: backend

      - name: Deploy Worker (preview)
        id: deploy-worker
        run: |
          OUTPUT=$(npx wrangler@4.131.1 deploy --minify --env preview 2>&1)
          echo "$OUTPUT"
          WORKER_URL=$(echo "$OUTPUT" | grep -oP 'https://\S+\.workers\.dev' | head -1)
          echo "url=$WORKER_URL" >> "$GITHUB_OUTPUT"
        working-directory: backend

      - name: Set preview Worker secrets (same-origin URLs)
        run: |
          echo "${{ steps.deploy-worker.outputs.url }}" | npx wrangler@4.131.1 secret put BETTER_AUTH_URL --env preview
          echo "${{ steps.deploy-worker.outputs.url }}" | npx wrangler@4.131.1 secret put FRONTEND_URL --env preview
        working-directory: backend

      # --- Comment preview URL on PR ---
      # Always runs (even when an earlier step failed) so the PR never ends up
      # without a link. The comment is posted/updated by github-actions[bot].
      - name: Comment preview URLs on PR
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          WORKER_URL: ${{ steps.deploy-worker.outputs.url }}
        with:
          script: |
            const marker = '<!-- cf-preview -->';
            const branch = context.payload.pull_request.head.ref;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const appUrl = process.env.WORKER_URL || '';
            const failed = '⚠️ not deployed — [open the run](' + runUrl + ')';
            const link = appUrl ? `[${appUrl}](${appUrl})` : failed;
            const prodApp = 'https://makisend-poc.mute-hat-0e69.workers.dev';

            const body = [
              marker,
              '### 🔍 Preview Deployment',
              '',
              `**App (UI + API):** ${link}`,
              '',
              '| Production | URL |',
              '|------------|-----|',
              `| **App** | [${prodApp}](${prodApp}) |`,
              '',
              `Branch \`${branch}\` — preview updates on each push.`,
              `Last run: [${context.runId}](${runUrl})`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated existing bot comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
              core.info('Created new bot comment');
            }
