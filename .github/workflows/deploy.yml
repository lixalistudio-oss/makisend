name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint backend
        run: pnpm lint
        working-directory: backend

      - name: Test backend
        run: pnpm test:run
        working-directory: backend

      - name: Build frontend
        run: pnpm --filter frontend build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare (production)
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://makisend.pages.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --- Backend (Workers) ---

      - name: Apply D1 migrations (production)
        run: npx wrangler@4.131.1 d1 migrations apply makisend_db --remote
        working-directory: backend

      - name: Deploy Worker (production)
        id: deploy-worker
        run: |
          OUTPUT=$(npx wrangler@4.131.1 deploy --minify 2>&1)
          echo "$OUTPUT"
          WORKER_URL=$(echo "$OUTPUT" | grep -oP 'https://\S+\.workers\.dev' | head -1)
          echo "url=$WORKER_URL" >> "$GITHUB_OUTPUT"
        working-directory: backend

      # --- Frontend (Pages) ---

      - name: Build frontend with production Worker URL
        run: pnpm --filter frontend build
        env:
          PUBLIC_API_URL: ${{ steps.deploy-worker.outputs.url }}

      - name: Create Pages project if needed
        run: npx wrangler@4.131.1 pages project create makisend --production-branch=main || true

      - name: Deploy to Cloudflare Pages (production)
        id: pages-deploy
        run: |
          OUTPUT=$(npx wrangler@4.131.1 pages deploy frontend/dist/ --project-name=makisend --branch=main)
          echo "$OUTPUT"
          PAGES_URL=$(echo "$OUTPUT" | grep -oP 'https://\S+\.pages\.dev' | head -1)
          echo "url=$PAGES_URL" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "### Production Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend: ${{ steps.deploy-worker.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend: ${{ steps.pages-deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

  deploy-preview:
    name: Deploy preview to Cloudflare
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --- Backend preview (Workers) ---

      - name: Create preview D1 if needed
        id: create-db
        run: |
          set -eo pipefail
          echo "Listing D1 databases..."
          DB_ID=$(npx wrangler@4.131.1 d1 list --json | jq -r '.[] | select(.name == "makisend-db-preview") | .uuid' || echo "")
          if [ -z "$DB_ID" ]; then
            echo "Creating preview D1 database..."
            npx wrangler@4.131.1 d1 create makisend-db-preview
            DB_ID=$(npx wrangler@4.131.1 d1 list --json | jq -r '.[] | select(.name == "makisend-db-preview") | .uuid')
          else
            echo "Preview D1 database already exists: $DB_ID"
          fi
          echo "db_id=$DB_ID" >> "$GITHUB_OUTPUT"
          echo "Final DB_ID: $DB_ID"
        working-directory: backend

      - name: Configure preview database ID
        run: |
          sed -i "s/PREVIEW_DB_ID_PLACEHOLDER/${{ steps.create-db.outputs.db_id }}/" wrangler.jsonc
        working-directory: backend

      - name: Apply D1 migrations (preview)
        run: npx wrangler@4.131.1 d1 migrations apply makisend_db --remote --env preview
        working-directory: backend

      - name: Set preview Worker secrets
        run: |
          echo "${{ secrets.AES_256_KEY }}" | npx wrangler@4.131.1 secret put AES_256_KEY --env preview
          echo "${{ secrets.BETTER_AUTH_SECRET }}" | npx wrangler@4.131.1 secret put BETTER_AUTH_SECRET --env preview
        working-directory: backend

      - name: Deploy Worker (preview)
        id: deploy-worker
        run: |
          OUTPUT=$(npx wrangler@4.131.1 deploy --minify --env preview 2>&1)
          echo "$OUTPUT"
          WORKER_URL=$(echo "$OUTPUT" | grep -oP 'https://\S+\.workers\.dev' | head -1)
          echo "url=$WORKER_URL" >> "$GITHUB_OUTPUT"
        working-directory: backend

      - name: Set BETTER_AUTH_URL for preview
        run: |
          echo "${{ steps.deploy-worker.outputs.url }}" | npx wrangler@4.131.1 secret put BETTER_AUTH_URL --env preview
        working-directory: backend

      # --- Frontend preview (Pages) ---

      - name: Build frontend with preview Worker URL
        run: pnpm --filter frontend build
        env:
          PUBLIC_API_URL: ${{ steps.deploy-worker.outputs.url }}

      - name: Create Pages project if needed
        run: npx wrangler@4.131.1 pages project create makisend --production-branch=main || true

      - name: Deploy to Cloudflare Pages (preview)
        id: pages-deploy
        run: |
          OUTPUT=$(npx wrangler@4.131.1 pages deploy frontend/dist/ --project-name=makisend --branch=${{ github.head_ref }})
          echo "$OUTPUT"
          PAGES_URL=$(echo "$OUTPUT" | grep -oP 'https://\S+\.pages\.dev' | head -1)
          echo "url=$PAGES_URL" >> "$GITHUB_OUTPUT"

      # --- Comment preview URLs on PR ---

      - name: Comment preview URLs on PR
        uses: actions/github-script@v7
        env:
          WORKER_URL: ${{ steps.deploy-worker.outputs.url }}
          PAGES_URL: ${{ steps.pages-deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- cf-preview -->';
            const branch = context.payload.pull_request.head.ref;
            const workerUrl = process.env.WORKER_URL;
            const pagesUrl = process.env.PAGES_URL;
            const body = [
              marker,
              '### 🔍 Preview Deployment',
              '',
              '| Service | URL |',
              '|---------|-----|',
              `| **Frontend** (Pages) | ${pagesUrl} |`,
              `| **Backend** (Workers) | ${workerUrl} |`,
              '',
              `Branch \`${branch}\` — updates on each push.`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }
