name: Docker image

# Builds the self-hosting image (docker/Dockerfile) and pushes it to
# ghcr.io/lixalistudio-oss/makisend, in three ways:
#   - after every green CI run on main (workflow_run): tags `edge` and `sha-<commit>`;
#   - called by release.yml right after it publishes a release (a release created with
#     GITHUB_TOKEN does not trigger `release` events itself): tags X.Y.Z, X.Y and latest;
#   - by hand (workflow_dispatch): an existing release tag, or no tag to publish `edge` from the
#     branch you run it on (the way to publish a first image without waiting for a merge).
# `latest` only ever moves on a stable release, never on a main build.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, e.g. v0.3.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v0.3.1. Leave empty to build the selected branch as edge.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ inputs.tag || 'main' }}
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: ghcr.io/lixalistudio-oss/makisend

jobs:
  # Nothing is pushed unless the image sends a real mail (Mailpit), runs its cron and keeps its data.
  # A main build skips it: the green CI run that triggered it already ran this test (docker-e2e).
  test:
    name: Test the image end to end
    if: github.repository == 'lixalistudio-oss/makisend' && github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:e2e:docker
        working-directory: backend

  publish:
    name: Build and push the image
    needs: test
    # Copies of this repository must not publish to our registry. A skipped `test` job (main
    # builds) must not block the push, hence always(); a failed one still does.
    if: >-
      always() && !cancelled() && needs.test.result != 'failure'
      && github.repository == 'lixalistudio-oss/makisend'
      && (github.event_name != 'workflow_run'
          || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the release tag, or the commit CI validated
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.workflow_run.head_sha || github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Release 0.3.0 -> 0.3.0, 0.3, latest (and 0 from 1.0.0). A prerelease (0.4.0-rc.1) only gets its own tag,
      # so `latest` always points at the newest stable release. A main build -> edge, sha-<commit>.
      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || 'v0.0.0' }},enable=${{ inputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || 'v0.0.0' }},enable=${{ inputs.tag != '' }}
            type=semver,pattern={{major}},value=${{ inputs.tag || 'v0.0.0' }},enable=${{ inputs.tag != '' && !contains(inputs.tag, '-') }}
            type=raw,value=latest,enable=${{ inputs.tag != '' && !contains(inputs.tag, '-') }}
            type=raw,value=edge,enable=${{ inputs.tag == '' }}
            type=raw,value=sha-${{ github.event.workflow_run.head_sha || github.sha }},enable=${{ inputs.tag == '' }}
          labels: |
            org.opencontainers.image.title=MakiSend
            org.opencontainers.image.description=Self-hosted transactional email API (Hono, Cloudflare Workers runtime, D1, SMTP)

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
