name: Docker image

# Builds the self-hosting image (docker/Dockerfile) and pushes it to
# ghcr.io/lixalistudio-oss/makisend. Called by release.yml right after it publishes a release
# (a release created with GITHUB_TOKEN does not trigger `release` events itself), and runnable
# by hand for an existing tag.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, e.g. v0.3.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v0.3.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ inputs.tag }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/lixalistudio-oss/makisend

jobs:
  publish:
    name: Build and push the image
    # Copies of this repository must not publish to our registry.
    if: github.repository == 'lixalistudio-oss/makisend'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 0.3.0 -> 0.3.0, 0.3, 0, latest. A prerelease (0.4.0-rc.1) only gets its own tag,
      # so `latest` always points at the newest stable release.
      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=semver,pattern={{major}},value=${{ inputs.tag }},enable=${{ !contains(inputs.tag, '-') }}
            type=raw,value=latest,enable=${{ !contains(inputs.tag, '-') }}
          labels: |
            org.opencontainers.image.title=MakiSend
            org.opencontainers.image.description=Self-hosted transactional email API (Hono, Cloudflare Workers runtime, D1, SMTP)

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
